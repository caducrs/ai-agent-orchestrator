name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - contracts
          - services/orchestrator
          - services/api-gateway
          - services/llm-gateway
          - services/agents
          - services/agents/code-agent
          - services/agents/log-agent
          - services/agents/database-agent
          - services/agents/infrastructure-agent
          - services/demo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/orchestrator/go.sum
      - run: node --check web/app.js
      - run: docker compose config --quiet
      - run: RUN_INTEGRATION_TESTS=1 GOWORK=off go test ./internal/store -run Integration
        working-directory: services/orchestrator
      - run: docker compose build
